spring:
  application:
    name: whatchat-backend
  main:
    allow-bean-definition-overriding: true
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb+srv://rishitha_whatchat_db_user:Rishu%401108@cluster0.skuwmba.mongodb.net/whatchat_db?retryWrites=true&w=majority}
      database: ${MONGODB_DATABASE:whatchat_db}
      auto-index-creation: false
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS:true}

# Security & JWT Configuration
security:
  jwt:
    secret-key: ${JWT_SECRET:whatchat-super-secure-jwt-signing-secret-key-2026-minimum-32-bytes}
    expiration-hours: ${JWT_EXPIRATION_HOURS:24}
  cookie:
    secure: ${COOKIE_SECURE:false}

app:
  url: ${APP_URL:http://localhost:5173}
  cors:
    origin: ${APP_ORIGIN:http://localhost:5173}
  mail:
    from: ${MAIL_FROM:noreply@whatchat.app}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui/index.html
    operationsSorter: method
    tagsSorter: alpha

server:
  port: ${PORT:8080}
